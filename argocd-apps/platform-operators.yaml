apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BhagyaLakshmiR/crc-gitops.git
    targetRevision: main
    path: operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
