apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-instance
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/KondaReddyR/crc-gitops.git
    targetRevision: main
    path: apps/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
