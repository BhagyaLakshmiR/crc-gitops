# ServiceMonitors for ArgoCD metrics in OpenShift GitOps
# These match the openshift-gitops namespace services
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: openshift-gitops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-gitops-application-controller
  namespaceSelector:
    matchNames:
      - openshift-gitops
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: openshift-gitops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-gitops-server
  namespaceSelector:
    matchNames:
      - openshift-gitops
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-repo-server
  namespace: openshift-gitops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-gitops-repo-server
  namespaceSelector:
    matchNames:
      - openshift-gitops
  endpoints:
    - port: metrics
      interval: 30s
