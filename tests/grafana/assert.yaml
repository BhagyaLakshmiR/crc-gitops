# Assert Grafana operator pod is running
apiVersion: v1
kind: Pod
metadata:
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana-operator
status:
  phase: Running
---
# Assert Grafana Operator CSV is succeeded
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  namespace: grafana
  labels:
    operators.coreos.com/grafana-operator.grafana: ""
status:
  phase: Succeeded
