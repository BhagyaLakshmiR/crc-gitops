apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-validation
spec:
  description: Validate CRC platform components are running correctly
  steps:
    - name: Validate ArgoCD
      try:
        - assert:
            file: argocd/assert.yaml
    - name: Validate Kyverno
      try:
        - assert:
            file: kyverno/assert.yaml
    - name: Validate Grafana Operator
      try:
        - assert:
            file: grafana/assert.yaml
    - name: Validate Cluster Logging
      try:
        - assert:
            file: cluster-logging/assert.yaml
