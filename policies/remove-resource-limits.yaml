apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: remove-resource-limits
  annotations:
    policies.kyverno.io/title: Remove Resource Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/description: >-
      Removes resource requests and limits from all pods.
      Used on CRC to allow pods to run without resource constraints.
spec:
  rules:
    - name: remove-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests: null
                  limits: null
            initContainers:
              - (name): "*"
                resources:
                  requests: null
                  limits: null
