# GitHub Repository Secret for ArgoCD
#
# IMPORTANT: Replace YOUR_GITHUB_PAT with your actual token before applying
# This file is a template - do not commit real tokens to git
#
apiVersion: v1
kind: Secret
metadata:
  name: crc-gitops-repo
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/KondaReddyR/crc-gitops.git
  username: KondaReddyR
  password: YOUR_GITHUB_PAT  # Replace with: gh auth token
