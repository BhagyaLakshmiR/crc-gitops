apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bootstrap resources - apply with: oc apply -k .
# Note: openshift-gitops.yaml installs the operator (run once manually).
#       argocd-patch.yaml is managed by the argocd-config ArgoCD Application.

resources:
  # Step 1: Install GitOps operator (creates ArgoCD CR after ~60s)
  - openshift-gitops.yaml

  # Step 2: ArgoCD CR configuration (RBAC, route, accounts)
  - argocd-patch.yaml

  # Step 3: Repo secret - create manually with:
  #   oc create secret generic crc-gitops-secret -n openshift-gitops \
  #     --from-literal=type=git \
  #     --from-literal=url=https://github.com/KondaReddyR/crc-gitops.git \
  #     --from-literal=username=KondaReddyR \
  #     --from-literal=password=<GITHUB_PAT>
  #   oc label secret crc-gitops-secret -n openshift-gitops \
  #     argocd.argoproj.io/secret-type=repository

  # Step 4: App-of-Apps (after all above)
  - platform-bootstrap-app.yaml
