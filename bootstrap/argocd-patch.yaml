apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  rbac:
    defaultPolicy: ""
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, kubeadmin, role:admin
      p, role:admin, *, *, *, allow
    scopes: '[groups, preferred_username]'
  extraConfig:
    accounts.kubeadmin: apiKey
  server:
    route:
      enabled: true
      tls:
        termination: passthrough
  controller:
    resources: {}
  redis:
    resources: {}
  repo:
    resources: {}
  applicationSet:
    resources: {}
  notifications:
    enabled: false
