apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  rbac:
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, kubeadmin, role:admin
    scopes: '[groups,name]'
  controller:
    resources: {}
  redis:
    resources: {}
  repo:
    resources: {}
  server:
    resources: {}
  applicationSet:
    resources: {}
  notifications:
    enabled: false
